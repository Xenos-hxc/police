server {
    listen 80;
    server_name railway-security.internal;

    # 生产启用 HTTPS 后取消以下配置并替换证书路径。
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/railway-security.crt;
    # ssl_certificate_key /etc/nginx/ssl/railway-security.key;
    # ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/railway-security-check/frontend;
    index index.html;
    client_max_body_size 5121m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ~ ^/(doc\.html|v3/api-docs|webjars/) {
        deny all;
    }
}
